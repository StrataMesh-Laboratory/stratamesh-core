# Live Cloudflare Worker bytes vs git. Observe. No PUT. Never fail the check.
name: gitlive-drift

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "stratamesh-impact-fund/workers/**"
      - "ops/bin/gitlive-drift.py"
      - "ops/config/worker-allow.json"
      - ".github/workflows/gitlive-drift.yml"

concurrency:
  group: gitlive-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOD_API: ${{ secrets.GOD_API }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare live /content to git
        id: drift
        run: python3 ops/bin/gitlive-drift.py
      - name: Comment #52 on hard drift only
        if: always() && steps.drift.outputs.hard == 'true'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- stratamesh-gitlive-drift -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 52, per_page: 20,
            });
            const last = [...comments].reverse().find(c => c.body && c.body.includes(marker));
            if (last && (Date.now() - new Date(last.created_at).getTime()) < 5 * 3600 * 1000) {
              core.info('skip duplicate drift comment');
              return;
            }
            const scripts = process.env.HARD_SCRIPTS || '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 52,
              body: [
                '## gitlive-drift hard DRIFT (observe; check stays green)',
                '',
                'Scripts: `' + scripts + '`',
                '',
                'Live Worker SHA-256 ≠ git (not hold_put). **Grok execute** (Actions does not PUT):',
                '',
                '```bash',
                'python3 ops/bin/desk-execute.py --from-pack artifacts/PUBLISH-PACK.json',
                '```',
                '',
                'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                '',
                marker,
              ].join('\n'),
            });
        env:
          HARD_SCRIPTS: ${{ steps.drift.outputs.hard_scripts }}

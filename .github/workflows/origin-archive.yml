# Daily snapshot — GitHub Action, NOT a 6th Cloudflare cron.
# Idempotent: archive-YYYY-MM-DD already published → skip (success).
# GITHUB_TOKEN cannot UPDATE a release created by a PAT
# ("Resource not accessible by integration"). Never PATCH. Never softprops.
name: origin-archive
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origin-archive
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip if today's archive exists
        id: have
        run: |
          DAY=$(date -u +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          if gh release view "archive-$DAY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "archive-$DAY already published — skip (idempotent success)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "archive-$DAY missing — will pack+release"
          fi
      - name: Pack day
        if: steps.have.outputs.exists != 'true'
        run: |
          DAY="${DAY:?}"
          mkdir -p /tmp/pile/$DAY /tmp/pile/$DAY/mac-fog /tmp/pile/$DAY/workerd
          cp -a frontend/. /tmp/pile/$DAY/ 2>/dev/null || true
          cp -a ops/METABOLISM.md /tmp/pile/$DAY/ 2>/dev/null || true
          cp -a deploy/mac-fog/. /tmp/pile/$DAY/mac-fog/ 2>/dev/null || true
          cp -a ops/workerd/. /tmp/pile/$DAY/workerd/ 2>/dev/null || true
          cp workers/stratamesh-origin-archive.js /tmp/pile/$DAY/ 2>/dev/null || true
          printf '%s\n' "{\"date\":\"$DAY\",\"sha\":\"${GITHUB_SHA}\",\"note\":\"daily origin archive + fog origin flux\"}" > /tmp/pile/$DAY/manifest.json
          tar -C /tmp/pile -czf /tmp/origin-archive-$DAY.tar.gz $DAY
      - name: Release (create only; never update PAT-owned)
        if: steps.have.outputs.exists != 'true'
        run: |
          DAY="${DAY:?}"
          TAG="archive-$DAY"
          TAR="/tmp/origin-archive-$DAY.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "race: $TAG appeared — skip (GITHUB_TOKEN must not PATCH)"
            exit 0
          fi
          if gh release create "$TAG" "$TAR" \
              --title "Origin archive $DAY" \
              --notes "Daily last-resort static pile for origin.calhegasmorais.pt. Staff-gated. Not a 6th CF cron." \
              --latest=false; then
            echo "created $TAG"
            exit 0
          fi
          # PAT-owned tag or concurrent create: GITHUB_TOKEN cannot update. Green if viewable.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists (PAT-owned or race) — idempotent success"
            exit 0
          fi
          echo "FAIL could not create or view $TAG"
          exit 1

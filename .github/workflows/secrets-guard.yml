# Fail PRs that paste live tokens. Public runner. No secrets required.
name: secrets-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan changed files for leaked tokens
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "changed: $FILES"
          if [ -z "$FILES" ]; then echo none; exit 0; fi
          if git diff "$BASE" "$HEAD" | grep -Eiq \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|cfat_[A-Za-z0-9]{20,}|cfut_[A-Za-z0-9]{20,}|deo_live_[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}'; then
            echo "FAIL leaked live token in PR diff"
            exit 1
          fi
          echo OK
      - name: No workers.dev ingest in workflow diffs
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff "$BASE" "$HEAD" -- .github/workflows | grep -Eiq 'https?://[^[:space:]]+workers\.dev'; then
            echo "FAIL workers.dev added under .github/workflows"
            exit 1
          fi
          echo OK

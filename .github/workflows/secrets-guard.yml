# Fail PRs *and* main pushes that paste live tokens.
# Public runner. No secrets required. Git Data API ships must not bypass this.
name: secrets-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan changed files for leaked tokens
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          # Live-token shaped: prefix + body with at least one digit (catalog "cfat_" is doctrine).
          LIVE = re.compile(
              r"(?:ghp_|ghu_|gho_|ghs_|ghr_|github_pat_|cfat_|cfut_|hf_|sk-|smva_|deo_live_)"
              r"(?=[A-Za-z0-9_\-]*\d)[A-Za-z0-9_\-]{16,}"
          )
          WORKERS_DEV = re.compile(r"https?://[^\s]+workers\.dev", re.I)

          event = os.environ.get("EVENT_NAME") or ""
          if event == "pull_request":
              base = os.environ.get("PR_BASE") or ""
              head = os.environ.get("PR_HEAD") or ""
          else:
              base = os.environ.get("PUSH_BEFORE") or ""
              head = os.environ.get("PUSH_HEAD") or ""
          if not base or set(base) <= {"0"}:
              print("no base (first push) — skip")
              sys.exit(0)
          if not head:
              print("no head — skip")
              sys.exit(0)
          diff = subprocess.check_output(
              ["git", "diff", base, head], text=True, errors="replace"
          )
          names = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True, errors="replace"
          )
          print("changed:", " ".join(names.split()) or "(none)")
          if not names.strip():
              print("none"); sys.exit(0)
          hits = sorted({m.group(0)[:8] + "… len=" + str(len(m.group(0))) for m in LIVE.finditer(diff)})
          if hits:
              print("FAIL leaked live-token-shaped string in diff:", hits)
              sys.exit(1)
          wf = subprocess.check_output(
              ["git", "diff", base, head, "--", ".github/workflows"],
              text=True, errors="replace",
          )
          if WORKERS_DEV.search(wf):
              print("FAIL workers.dev added under .github/workflows")
              sys.exit(1)
          print("OK")
          PY

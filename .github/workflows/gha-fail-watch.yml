# Observe failed Actions runs. Log + #52 notify. Grok fixes. Never re-run from here.
# No workflow_run fanout (that skipped 80+ times per push). Schedule + dispatch only.
name: gha-fail-watch

on:
  schedule:
    - cron: "20 4,12,18,23 * * *"
  workflow_dispatch:

concurrency:
  group: gha-fail-watch
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESK_TICK_OUT: ${{ github.workspace }}/artifacts
      DESK_ISSUE: "52"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan failed runs
        id: watch
        run: python3 ops/bin/gha-fail-watch.py
      - name: Upload fail log
        if: always()
        uses: ./.github/actions/upload-desk
        with:
          name: gha-fail-log

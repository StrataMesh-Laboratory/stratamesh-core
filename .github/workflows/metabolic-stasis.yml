name: metabolic-stasis

# Sample remaining + pace only. STASIS/HOLD = burn-rate, never freeze Workers/processes.
# Never PATCH Worker env STASIS=1 (that 503s login). decide() STASIS must not 503.
# No 6th CF cron. Existing GH cron only GraphQL + D1 snapshot, no Worker PUT.

on:
  schedule:
    - cron: "12 */3 * * *"
  workflow_dispatch:

concurrency:
  group: metabolic-stasis
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOD_API: ${{ secrets.GOD_API }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_WORKER_DAY_CAP: "100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore previous circuit (optional artifact)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39883 # v4
        with:
          path: stasis-state.json
          key: stasis-state-${{ github.run_id }}
          restore-keys: |
            stasis-state-
      - name: GraphQL remaining vs rails cap (pace, never freeze)
        id: stasis
        run: python3 ops/bin/metabolic-stasis-enforce.py
        continue-on-error: true
      - name: STASIS is min pace, not Worker freeze
        if: always()
        run: |
          echo "Never env STASIS=1. Never freeze Workers/processes. Never 503 login because decide() is STASIS."
          echo "Job stays green: sample remaining and pace only."
          test -f stasis-state.json && python3 -c "import json; d=json.load(open('stasis-state.json')); print('circuit', d.get('circuit'), 'remaining', d.get('remaining'), 'pace_factor', d.get('pace_factor'), 'freeze_flag_ignored', d.get('freeze'))" || echo "no state"

# Dev labor on public runners: compile + metabolism tests + dry tick.
# Protocol/gossip stay in their own path-filtered workflows.
name: dev-labor

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "ops/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "docs/EDGE-GROK-ACTIONS-PACKAGE.md"

permissions:
  contents: read

jobs:
  labor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile desk tools
        run: python3 -m py_compile ops/bin/desk-tick.py ops/bin/desk-prepare.py ops/bin/desk-execute.py ops/bin/desk-publish.py ops/bin/gitlive-drift.py ops/bin/worker-inventory.py ops/bin/gha-fail-watch.py scripts/api-gitlive-publish.py
      - name: Config JSON
        run: python3 -c "import json,pathlib; json.loads(pathlib.Path('ops/config/health-probes.json').read_text()); json.loads(pathlib.Path('ops/config/worker-allow.json').read_text()); print('ok', len(json.loads(pathlib.Path('ops/config/worker-allow.json').read_text())['scripts']))"
      - name: Metabolism unit tests
        run: |
          python3 ops/lib/test_metabolism.py
          python3 ops-monitor/lib/test_metabolism.py
      - name: desk-execute refuses GITHUB_ACTIONS
        env:
          GITHUB_ACTIONS: "true"
        run: |
          if python3 ops/bin/desk-execute.py --git; then
            echo "FAIL execute must refuse Actions"
            exit 1
          fi
          echo "execute correctly HOLD on Actions"
      - name: Dry tick (public probes, no GOD_API)
        env:
          DESK_TICK_OUT: ${{ github.workspace }}/artifacts
        run: python3 ops/bin/desk-tick.py || true
      - name: Never workers.dev ingest URLs in workflows
        run: |
          # Comments/guards mention the string; fail only on live host URLs.
          if grep -RIn --include='*.yml' -E 'https?://[^[:space:]]+workers\.dev' .github/workflows; then
            echo FAIL live workers.dev URL in Actions YAML
            exit 1
          fi
          echo OK

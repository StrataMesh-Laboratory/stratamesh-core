# HEAD hop-weight. Does not call non-reusable workflows.
name: hop-weight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/config/contingency.json"
      - "ops/bin/hop-weight.py"
      - ".github/workflows/hop-weight.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: hop-weight
  cancel-in-progress: true

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 ops/bin/hop-weight.py
      - name: dispatch live origins
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            for (const id of ["live-from-git.yml", "loci-pages.yml"]) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: id,
                ref: "main",
              }).catch((e) => console.log(id, e.message));
            }

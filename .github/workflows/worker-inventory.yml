# Fail the desk if someone adds a 6th CF cron or exceeds 100 published scripts.
name: worker-inventory

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/bin/worker-inventory.py"
      - ".github/workflows/worker-inventory.yml"

permissions:
  contents: read
  issues: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOD_API: ${{ secrets.GOD_API }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List scripts + cron cap 5
        id: inv
        run: python3 ops/bin/worker-inventory.py
        continue-on-error: true
      - name: Comment #123 if 6th cron
        if: steps.inv.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ISSUE = 123;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ISSUE,
                body: '## worker-inventory FAIL\n\nCron count > 5 or script cap. Never a 6th CF cron.\n\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\n<!-- stratamesh-worker-inventory -->',
              });
            } catch (e) {
              const status = e.status || (e.response && e.response.status);
              const msg = String((e.message || e));
              if (status === 403 || status === 404 || /locked/i.test(msg)) {
                core.info('skip-locked: ' + status + ' ' + msg);
              } else {
                throw e;
              }
            }
            core.setFailed('inventory');

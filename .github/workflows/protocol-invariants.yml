# Lab protocol gates — in-process only.
# Does NOT probe Workers, portals, or public URLs (see mesh-health.yml for that).
# Does NOT claim multi-host gossip, mainnet, or aBFT.
name: protocol-invariants
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/protocol-invariants.yml"
      - "docs/WIRE-PROTOCOL-v1.md"
      - "docs/THREAT-MODEL-v1.md"
      - "requirements-dev.txt"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/protocol-invariants.yml"
      - "docs/WIRE-PROTOCOL-v1.md"
      - "docs/THREAT-MODEL-v1.md"
      - "requirements-dev.txt"
  workflow_dispatch:

jobs:
  lab-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Origin fallback state machine (30 min, no network)
        working-directory: src
        run: python3 test_origin_fallback.py
      - name: Tip-selection property tests
        working-directory: src
        run: python3 test_tip_selection.py
      - name: I1–I6 named checks (miniature LabLedger + DAG replay)
        working-directory: src
        run: python3 test_economic_invariants.py
      - name: Fog ping + keep-up stream (no STRATA movement)
        working-directory: src
        run: python3 test_fog_plugins.py
      - name: Agora /status settlements honesty (#40 envelope, not scalar 0)
        working-directory: src
        run: python3 test_status_settlements.py
      - name: Fog /status spa+dag pulse honesty (#148 #149)
        working-directory: src
        run: python3 test_status_pulse.py
      - name: OSS PASS Atelier + MUD tables + OZ scaffold
        working-directory: src
        run: python3 test_oss_pass_mud_tables.py
      - name: Olissippo lore world Phase 1 (location graph)
        working-directory: src
        run: python3 test_olissippo_world.py
      - name: Olissippo lore Boutius Phase 2 (ACB Subject ≠ NFT)
        working-directory: src
        run: python3 test_olissippo_boutius.py
      - name: Olissippo lore decide Phase 3 (LLM-advisory, ACB ≠ NFT)
        working-directory: src
        run: python3 test_olissippo_decide.py
      - name: Olissippo lore memory Phase 4 (MemoryEvent + SubjectEdge, ACB ≠ NFT)
        working-directory: src
        run: python3 test_olissippo_memory.py
      - name: Olissippo lore personas Phase 5 (five ACBs ≠ NFT)
        working-directory: src
        run: python3 test_olissippo_personas.py
      - name: Olissippo lore Atelier Phase 6 (lore stage, ACB ≠ NFT, not main)
        working-directory: src
        run: python3 test_olissippo_atelier.py
      - name: Olissippo identity≠role + lore≠main sandbox host
        working-directory: src
        run: python3 test_olissippo_identity.py
      - name: Olissippo Phase 7 council games (Diplomacy+Nomic+kin, ACB ≠ NFT)
        working-directory: src
        run: python3 test_olissippo_council_games.py
      - name: Olissippo Phase 8 council decide wire + STRATA object stamps
        working-directory: src
        run: python3 test_olissippo_phase8_council_wire.py
      - name: Olissippo Phase 8A/8B five engines + event pipeline
        working-directory: src
        run: python3 test_olissippo_phase8_engines.py
      - name: Olissippo Phase 8C pure adjudicators + dynasty clock
        working-directory: src
        run: python3 test_olissippo_phase8c_adjudicators.py
      - name: Olissippo dynasty clock (1 real day = 1 game month)
        working-directory: src
        run: python3 test_olissippo_dynasty_clock.py
      - name: Olissippo gens continuity (elective, inherit, absentee)
        working-directory: src
        run: python3 test_olissippo_dynasty_continuity.py
      - name: Olissippo language player pools (CPLP/Intl microhv)
        working-directory: src
        run: python3 test_olissippo_player_pools.py
      - name: Olissippo Phase 8E cross-system scenarios
        working-directory: src
        run: python3 test_olissippo_phase8e_cross_system.py
      - name: User PAYG subsistence (registered dashboard, burn to #0)
        working-directory: src
        run: python3 test_user_payg.py
      - name: Per-account #mint/#0 lifecycle on-graph
        working-directory: src
        run: python3 test_account_lifecycle.py
      - name: Resource-proof MVP (compute hash work-token)
        working-directory: src
        run: python3 test_resource_proof.py
      - name: Digital object registry (sqlite, no STRATA mint)
        working-directory: src
        run: python3 test_object_registry.py
      - name: Four-layer object catalog (CID/DAG/NFT/STRATA)
        working-directory: src
        run: python3 test_object_layers.py
      - name: CID-only store (no NFT mint)
        working-directory: src
        run: python3 test_cid_store.py
      - name: Hypothesis StrataTokenLedger (lab-only, not multi-host)
        working-directory: src
        run: |
          python3 -m pip install --user -r ../requirements-dev.txt
          python3 test_fog_ledger_invariants.py
      - name: Protocol benchmark (WIRE + THREAT scenarios)
        working-directory: src
        run: python3 protocol_benchmark.py --nodes 4 --rounds 12 --seed 42

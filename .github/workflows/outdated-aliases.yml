name: outdated-aliases

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/landing-pt.html"
      - "frontend/portal-pt.html"
      - "frontend/sandbox.html"
      - "ops/bin/outdated_aliases_check.py"
      - "ops/workerd/worker.js"
      - "ops/workerd/config.capnp"
      - ".github/workflows/outdated-aliases.yml"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: outdated-aliases
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outdated: ${{ steps.chk.outcome }}
      html_outdated: ${{ steps.parse.outputs.html_outdated }}
      health_outdated: ${{ steps.parse.outputs.health_outdated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: chk
        name: outdated_aliases_check vs HEAD mark
        run: python3 ops/bin/outdated_aliases_check.py
        continue-on-error: true
      - id: parse
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          r = {}
          try:
              r = json.load(open("alias-report.json"))
          except Exception:
              pass
          html = "true" if r.get("html_outdated") else "false"
          health = "true" if r.get("health_outdated") else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"html_outdated={html}\n")
              f.write(f"health_outdated={health}\n")
          print("html_outdated", html, "health_outdated", health)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alias-report
          path: alias-report.json
          if-no-files-found: ignore

  align-pages:
    needs: check
    if: needs.check.outputs.html_outdated == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.GOD_API }}
      CLOUDFLARE_ACCOUNT_ID: f3645fcb56675cf7250d8ba7358eb252
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Stage Pages tree from HEAD
        run: |
          set -euo pipefail
          mkdir -p dist/video
          cp frontend/landing-pt.html dist/index.html
          cp frontend/landing-en.html dist/en.html
          cp frontend/portal-pt.html dist/portal-pt.html
          cp frontend/sandbox.html dist/sandbox.html
          cp frontend/fog-appliance.html dist/fog-appliance.html
          cp frontend/fog-infrastructure.html dist/fog-infrastructure.html
          cp frontend/fog-stack.html dist/fog-stack.html
          cp frontend/maintenance-1xxx.html dist/maintenance-1xxx.html
          printf '%s\n' '/en /en.html 200' '/dashboard /portal-pt.html 200' '/login /portal-pt.html 200' '/sandbox /sandbox.html 200' '/hold /maintenance-1xxx.html 200' '/fog-appliance /fog-appliance.html 200' '/en/fog-appliance /fog-appliance.html 200' '/fog-infrastructure /fog-infrastructure.html 200' '/en/fog-infrastructure /fog-infrastructure.html 200' '/fog-stack /fog-stack.html 200' '/en/fog-stack /fog-stack.html 200' > dist/_redirects
          cp frontend/video/stratamesh-lab.mp4 dist/video/stratamesh-lab.mp4
          cp frontend/video/stratamesh-lab-portrait.mp4 dist/video/stratamesh-lab-portrait.mp4
          cp frontend/video/stratamesh-lab.jpg dist/video/stratamesh-lab.jpg
          cp frontend/video/stratamesh-lab-portrait.jpg dist/video/stratamesh-lab-portrait.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/video/stratamesh-lab.mp4")
          mag = p.read_bytes()[:8] if p.exists() else b""
          if mag[4:8] != b"ftyp":
              raise SystemExit("intro mp4 is not ftyp — refuse to ship HTML-as-video")
          print("intro mp4", p.stat().st_size)
          PY
      - name: wrangler pages deploy calhegasmorais-pt
        run: npx --yes wrangler@3.80.0 pages deploy dist --project-name=calhegasmorais-pt --commit-dirty=true
      - name: wrangler pages deploy stratamesh hub
        run: npx --yes wrangler@3.80.0 pages deploy loci/pages --project-name=stratamesh --commit-dirty=true
        continue-on-error: true

  d1-fallback:
    needs: check
    if: needs.check.outputs.html_outdated == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger live-from-git (D1/spa keys)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'live-from-git.yml',
              ref: 'main',
              inputs: { force_all: 'true' }
            });

name: metabolism

on:
  pull_request:
    paths:
      - "ops-monitor/lib/**"
      - "ops-monitor/config/rails.json"
      - "ops/config/rails.json"
      - "workers/_metabolism.js"
      - ".github/workflows/metabolism.yml"
  push:
    branches: [main]
    paths:
      - "ops-monitor/lib/**"
      - "ops-monitor/config/rails.json"
      - "ops/config/rails.json"
      - "workers/_metabolism.js"
      - ".github/workflows/metabolism.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: metabolism tests (ops-monitor)
        run: python3 ops-monitor/lib/test_metabolism.py
      - name: metabolism tests (ops)
        run: python3 ops/lib/test_metabolism.py

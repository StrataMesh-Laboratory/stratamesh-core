name: Universal Contribution Audit & EDGE-GROK Integration

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to audit and manage
        required: true
      action:
        description: Action to perform on the PR
        required: true
        type: choice
        options:
          - audit
          - approve_and_merge
          - request_changes
          - close_with_feedback
      audit_focus:
        description: Audit focus (comma-separated tags)
        required: false
        default: syntax,security,performance,style
      custom_feedback:
        description: Custom feedback or justification
        required: false
      edge_grok_notify:
        description: Notify EDGE-GROK automation desk (HOLD default false — Worker Q-gate)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  EDGE_GROK_API: https://api-edge.calhegasmorais.pt
  EDGE_GROK_ENDPOINT: /automation/desk/tasks

jobs:
  audit_and_manage:
    name: Universal Contribution Audit & EDGE-GROK Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      audit_passed: ${{ steps.audit.outputs.passed }}
      audit_score: ${{ steps.audit.outputs.score }}
      audit_summary: ${{ steps.audit.outputs.summary }}
      edge_grok_task_id: ${{ steps.edge_grok_create.outputs.task_id }}
      edge_grok_status: ${{ steps.edge_grok_update.outputs.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get PR details
        id: pr_details
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER || '0', 10);
            if (isNaN(prNum) || prNum <= 0) {
              throw new Error(`Invalid PR number: ${process.env.PR_NUMBER}`);
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum
            });
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum
            });
            core.setOutput('number', String(prNum));
            core.setOutput('title', pr.data.title);
            core.setOutput('author', pr.data.user.login);
            core.setOutput('head_repo', pr.data.head.repo?.full_name || 'N/A');
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_branch', pr.data.base.ref);
            core.setOutput('files_changed', String(files.data.length));
            core.setOutput('additions', String(pr.data.additions));
            core.setOutput('deletions', String(pr.data.deletions));
            core.setOutput('url', pr.data.html_url);

      - name: Perform audit
        id: audit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          AUDIT_FOCUS: ${{ github.event.inputs.audit_focus }}
          PR_TITLE: ${{ steps.pr_details.outputs.title }}
          PR_AUTHOR: ${{ steps.pr_details.outputs.author }}
          FILES_CHANGED: ${{ steps.pr_details.outputs.files_changed }}
          ADDITIONS: ${{ steps.pr_details.outputs.additions }}
          DELETIONS: ${{ steps.pr_details.outputs.deletions }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const auditFocus = process.env.AUDIT_FOCUS.split(',').map(s => s.trim());
            const prTitle = process.env.PR_TITLE;
            const prAuthor = process.env.PR_AUTHOR;
            const filesChanged = parseInt(process.env.FILES_CHANGED, 10);
            const additions = parseInt(process.env.ADDITIONS, 10);
            const deletions = parseInt(process.env.DELETIONS, 10);
            
            let auditPassed = true;
            let issues = [];
            let warnings = [];
            let score = 100;
            
            if (auditFocus.includes('syntax')) {
              if (!prTitle || prTitle.trim().length === 0) {
                issues.push('Empty PR title');
                auditPassed = false;
                score -= 30;
              }
              if (prTitle && prTitle.length > 100) {
                warnings.push('PR title too long (>100 chars)');
                score -= 5;
              }
            }
            
            if (auditFocus.includes('security')) {
              warnings.push('Manual code review recommended');
              score -= 10;
            }
            
            if (auditFocus.includes('performance')) {
              if (additions > 1000 && filesChanged > 20) {
                warnings.push('Large change: >1000 additions');
                score -= 15;
              }
            }
            
            if (auditFocus.includes('style')) {
              if (prTitle && /[a-z]/.test(prTitle.charAt(0))) {
                warnings.push('PR title should start with capital letter');
                score -= 5;
              }
            }
            
            if (filesChanged > 50) {
              warnings.push(`Large PR: ${filesChanged} files`);
              score -= 10;
            }
            
            score = Math.max(0, score);
            const summary = `Author=${prAuthor} Files=${filesChanged} Changes=+${additions}/-${deletions} Score=${score} Status=${auditPassed ? 'PASS' : 'FAIL'}`;
            
            core.setOutput('passed', auditPassed ? 'true' : 'false');
            core.setOutput('score', String(score));
            core.setOutput('issues', JSON.stringify(issues));
            core.setOutput('warnings', JSON.stringify(warnings));
            core.setOutput('summary', summary);

      - name: Create EDGE-GROK task
        id: edge_grok_create
        if: github.event.inputs.edge_grok_notify == 'true'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          PR_TITLE: ${{ steps.pr_details.outputs.title }}
          PR_AUTHOR: ${{ steps.pr_details.outputs.author }}
          PR_URL: ${{ steps.pr_details.outputs.url }}
          ACTION: ${{ github.event.inputs.action }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const axios = require('axios');
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const action = process.env.ACTION;
            const auditScore = parseInt(process.env.AUDIT_SCORE, 10);
            
            const taskPayload = {
              source: 'github_actions',
              task_type: 'pr_contribution_audit',
              priority: auditScore >= 80 ? 'high' : auditScore >= 50 ? 'medium' : 'low',
              status: 'pending_review',
              metadata: {
                pr_number: prNum,
                pr_title: process.env.PR_TITLE,
                pr_author: process.env.PR_AUTHOR,
                pr_url: process.env.PR_URL,
                repository: context.repo.owner + '/' + context.repo.repo,
                action_requested: action,
                audit_score: auditScore,
                audit_summary: process.env.AUDIT_SUMMARY,
                workflow_run_id: context.runId,
                timestamp: new Date().toISOString()
              }
            };
            
            try {
              const response = await axios.post(
                process.env.EDGE_GROK_API + '/automation/desk/tasks',
                taskPayload,
                {
                  headers: {
                    'Content-Type': 'application/json',
                    'X-GitHub-Repository': context.repo.owner + '/' + context.repo.repo,
                    'X-GitHub-Workflow': 'universal-contribution-audit',
                    'X-GitHub-Run-ID': String(context.runId)
                  },
                  timeout: 10000,
                  validateStatus: function() { return true; }
                }
              );
              
              const taskId = response.data?.task_id || response.data?.id || 'task-' + Date.now();
              core.setOutput('task_id', taskId);
              core.notice(`EDGE-GROK task created: ${taskId}`);
            } catch (error) {
              core.warning(`EDGE-GROK create warning: ${error.message}`);
              core.setOutput('task_id', 'error');
            }

      - name: Request changes
        id: request_changes
        if: github.event.inputs.action == 'request_changes'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          AUDIT_ISSUES: ${{ steps.audit.outputs.issues }}
          AUDIT_WARNINGS: ${{ steps.audit.outputs.warnings }}
          CUSTOM_FEEDBACK: ${{ github.event.inputs.custom_feedback }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const issues = JSON.parse(process.env.AUDIT_ISSUES || '[]');
            const warnings = JSON.parse(process.env.AUDIT_WARNINGS || '[]');
            const customFeedback = process.env.CUSTOM_FEEDBACK || '';
            
            let body = '## Changes Requested\n\n';
            if (issues.length > 0) {
              body += '### Issues\n' + issues.map(i => `- ${i}`).join('\n') + '\n\n';
            }
            if (warnings.length > 0) {
              body += '### Warnings\n' + warnings.map(w => `- ${w}`).join('\n') + '\n\n';
            }
            if (customFeedback) {
              body += `### Feedback\n${customFeedback}\n\n`;
            }
            body += '_Reviewed by EDGE-GROK automated audit system_';
            
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNum,
                event: 'REQUEST_CHANGES',
                body: body
              });
            } catch (error) {
              core.setFailed(`Failed: ${error.message}`);
            }

      - name: Approve and merge
        id: approve_merge
        if: github.event.inputs.action == 'approve_and_merge' && steps.audit.outputs.passed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNum, per_page: 100
            });
            const protocol = (files.data || []).filter(f => {
              const p = (f.filename || '').toLowerCase();
              return p.startsWith('src/') || p.startsWith('docs/wire-protocol') || p.startsWith('docs/threat-model') || p.includes('stratamesh-auth') || p.includes('consensus') || p.includes('crypto');
            });
            if (protocol.length) {
              core.notice('REFUSE force-merge protocol/consensus/crypto/auth: ' + protocol.map(f => f.filename).join(', '));
              return;
            }
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body: `✅ Audit Passed (${process.env.AUDIT_SCORE}/100)\n\n${process.env.AUDIT_SUMMARY}\n\n🚀 Merging via EDGE-GROK automation...`
              });
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNum,
                merge_method: 'merge'
              });
            } catch (error) {
              core.setFailed(`Merge failed: ${error.message}`);
            }

      - name: Close with feedback
        id: close_feedback
        if: github.event.inputs.action == 'close_with_feedback'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
          CUSTOM_FEEDBACK: ${{ github.event.inputs.custom_feedback }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const feedback = process.env.CUSTOM_FEEDBACK || 'Does not meet requirements';
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body: `🚫 Closed (${process.env.AUDIT_SCORE}/100)\n\n${process.env.AUDIT_SUMMARY}\n\nReason: ${feedback}`
              });
              
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNum,
                state: 'closed'
              });
            } catch (error) {
              core.setFailed(`Close failed: ${error.message}`);
            }

      - name: Audit only
        id: audit_only
        if: github.event.inputs.action == 'audit'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
          AUDIT_ISSUES: ${{ steps.audit.outputs.issues }}
          AUDIT_WARNINGS: ${{ steps.audit.outputs.warnings }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const issues = JSON.parse(process.env.AUDIT_ISSUES || '[]');
            const warnings = JSON.parse(process.env.AUDIT_WARNINGS || '[]');
            
            let body = `📋 Audit Report (${process.env.AUDIT_SCORE}/100)\n\n${process.env.AUDIT_SUMMARY}\n\n`;
            if (issues.length > 0) {
              body += '### Issues\n' + issues.map(i => `- ${i}`).join('\n') + '\n\n';
            }
            if (warnings.length > 0) {
              body += '### Warnings\n' + warnings.map(w => `- ${w}`).join('\n') + '\n';
            }
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body: body
              });
            } catch (error) {
              core.notice(`Audit posted: ${process.env.AUDIT_SUMMARY}`);
            }

      - name: Update EDGE-GROK task
        id: edge_grok_update
        if: github.event.inputs.edge_grok_notify == 'true' && steps.edge_grok_create.outputs.task_id != 'error'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EDGE_GROK_API: ${{ env.EDGE_GROK_API }}
          TASK_ID: ${{ steps.edge_grok_create.outputs.task_id }}
          PR_NUMBER: ${{ steps.pr_details.outputs.number }}
          ACTION: ${{ github.event.inputs.action }}
          AUDIT_PASSED: ${{ steps.audit.outputs.passed }}
          AUDIT_SCORE: ${{ steps.audit.outputs.score }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const axios = require('axios');
            const taskId = process.env.TASK_ID;
            const auditPassed = process.env.AUDIT_PASSED === 'true';
            
            const updatePayload = {
              status: auditPassed ? 'completed' : 'flagged',
              result: {
                audit_passed: auditPassed,
                action_taken: process.env.ACTION,
                audit_score: parseInt(process.env.AUDIT_SCORE, 10),
                pr_number: parseInt(process.env.PR_NUMBER, 10),
                completed_at: new Date().toISOString()
              }
            };
            
            try {
              const response = await axios.patch(
                process.env.EDGE_GROK_API + '/automation/desk/tasks/' + taskId,
                updatePayload,
                {
                  headers: {
                    'Content-Type': 'application/json',
                    'X-GitHub-Run-ID': String(context.runId)
                  },
                  timeout: 10000,
                  validateStatus: function() { return true; }
                }
              );
              
              core.setOutput('status', 'updated');
              core.notice(`EDGE-GROK task updated: ${taskId}`);
            } catch (error) {
              core.warning(`EDGE-GROK update failed: ${error.message}`);
              core.setOutput('status', 'update_failed');
            }

      - name: Workflow summary
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.summary
              .addHeading('Workflow Summary', 2)
              .addRaw(`**PR:** #${{ steps.pr_details.outputs.number }}\n`)
              .addRaw(`**Action:** ${{ github.event.inputs.action }}\n`)
              .addRaw(`**Audit Score:** ${{ steps.audit.outputs.score }}/100\n`)
              .addRaw(`**EDGE-GROK Task:** ${{ steps.edge_grok_create.outputs.task_id }}\n`)
              .write();

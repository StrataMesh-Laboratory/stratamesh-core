# Intentionally does NOT publish. Execute is Grok: ops/bin/desk-execute.py
# This dispatch only runs desk-prepare (labor + draft).
name: desk-publish

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Prepare pack for Grok execute (no PUT from Actions)"
        required: false
        default: "labor-only"

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    uses: ./.github/workflows/desk-prepare.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

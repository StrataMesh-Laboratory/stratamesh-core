# EDGE-GROK observe tick. Replaces Grok hourly #52 *observe* (not publish).
# 6 Lisbon-aligned slots = grok-auto daily_limit. Public runner net $0.
name: desk-tick

on:
  schedule:
    - cron: "0 3,8,11,17,20,22 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desk-tick
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  tick:
    name: Observe /health + honesty
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOD_API: ${{ secrets.GOD_API }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      DESK_TICK_OUT: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: desk-tick
        id: tick
        run: python3 ops/bin/desk-tick.py
      - name: Upload tick artifacts
        if: always()
        uses: ./.github/actions/upload-desk
        with:
          name: desk-tick
      - name: Ledger #52 on HOLD (never fail the check)
        if: always() && steps.tick.outputs.hold == 'true'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- stratamesh-desk-tick -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 52, per_page: 20,
            });
            const last = [...comments].reverse().find(c => c.body && c.body.includes(marker));
            if (last && (Date.now() - new Date(last.created_at).getTime()) < 3 * 3600 * 1000) {
              core.info('skip duplicate tick HOLD comment');
              return;
            }
            let body = '## desk-tick HOLD (observe; check stays green)\n\nSee Actions run ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            try { body += '\n\n' + fs.readFileSync('artifacts/desk-tick.md', 'utf8'); } catch (_) {}
            body += '\n\n' + marker;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 52,
              body,
            });

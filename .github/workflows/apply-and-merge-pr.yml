name: Maintainer Auto-Apply and Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge (no default)
        required: true
      confirm_merge:
        description: Must be true to actually merge. Leave false to inspect only.
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  apply_and_merge:
    name: Inspect and optionally merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get PR info
        id: pr_info
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = process.env.PR_NUMBER || '';
            const prNum = parseInt(raw, 10);
            if (isNaN(prNum) || prNum <= 0) {
              core.notice('No PR number — inspect-only, not a failure.');
              core.setOutput('number', '');
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum
            });
            core.setOutput('number', String(prNum));
            core.setOutput('title', pr.data.title);
            core.setOutput('mergeable', String(pr.data.mergeable));
            core.setOutput('state', pr.data.state);
            core.notice('PR #' + prNum + ' ' + pr.data.title + ' state=' + pr.data.state + ' mergeable=' + pr.data.mergeable);

      - name: Merge PR
        if: ${{ github.event.inputs.confirm_merge == 'true' && steps.pr_info.outputs.number }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum
            });
            if (pr.data.state !== 'open') {
              throw new Error('PR is not open');
            }
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum,
              merge_method: 'squash'
            });
            core.notice('PR #' + prNum + ' squash-merged ' + result.data.sha);

      - name: Skip merge (inspect only)
        if: ${{ github.event.inputs.confirm_merge != 'true' }}
        run: echo "confirm_merge is false — no merge, no doc overwrite."

name: Maintainer Auto-Apply and Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to patch and merge
        required: true
        default: '21'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply_and_merge:
    name: Apply edits and merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get PR info
        id: pr_info
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER || '21', 10);
            if (isNaN(prNum) || prNum <= 0) {
              throw new Error(`Invalid PR number: ${process.env.PR_NUMBER}`);
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum
            });
            core.setOutput('number', String(prNum));
            core.setOutput('head_repo', pr.data.head.repo?.full_name);
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Clone and edit branch
        if: steps.pr_info.outputs.head_repo
        env:
          HEAD_REPO: ${{ steps.pr_info.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr_info.outputs.head_ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${TOKEN}@github.com/${HEAD_REPO}.git" work
          cd work
          git checkout "$HEAD_REF"
          git config user.email "bot@github.local"
          git config user.name "Bot"
          
          mkdir -p docs
          cat > docs/CONTRIBUTOR-TRACKS.md <<'EOF'
          ## Edge track: inventory → measurement (PoC)
          
          The edge inventory is a description of **capacity offered to the mesh**, not a
          list of every sensor field. A resource entry is billable only when it has a
          canonical `class` and a positive `units` value.
          EOF
          
          git add docs/CONTRIBUTOR-TRACKS.md
          git commit -m "docs: update contributor tracks" || true
          git push origin HEAD:"$HEAD_REF"

      - name: Approve PR
        if: steps.pr_info.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum,
              event: 'APPROVE',
              body: 'Approved by maintainer bot'
            });

      - name: Merge PR
        if: steps.pr_info.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNum,
                merge_method: 'merge'
              });
              core.notice(`PR #${prNum} merged successfully`);
            } catch (error) {
              core.warning(`Merge failed: ${error.message}`);
            }

      - name: Comment on PR
        if: steps.pr_info.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNum = parseInt(process.env.PR_NUMBER, 10);
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body: 'Maintainer edits applied and merged by workflow'
              });
            } catch (error) {
              core.notice(`Comment skipped: ${error.message}`);
            }

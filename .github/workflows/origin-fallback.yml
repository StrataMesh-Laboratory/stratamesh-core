# Observe public Fog origin. $0 runner. Does not flip DNS (session persist does).
# Was */10 (144/day) — WAF-hostile and overlapped edge-uptime. Twice hourly, offset.
name: origin-fallback

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

concurrency:
  group: origin-fallback
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DESK_ISSUE: "123"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Probe fog origin
        id: probe
        run: python3 ops/bin/origin-fallback-watch.py
      - name: Ledger #123 when DARK
        if: steps.probe.outputs.dark == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ISSUE = 123;
            const fs = require('fs');
            const marker = '<!-- stratamesh-origin-fallback -->';
            const body = fs.readFileSync('origin-fallback.md', 'utf8');
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: ISSUE, per_page: 30,
              });
              const last = [...comments].reverse().find(c => c.body && c.body.includes(marker));
              if (last && (Date.now() - new Date(last.created_at).getTime()) < 50 * 60 * 1000) {
                core.info('skip duplicate origin-fallback comment');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: ISSUE,
                body: marker + '\n' + body,
              });
            } catch (e) {
              const status = e.status || (e.response && e.response.status);
              const msg = String((e.message || e));
              if (status === 403 || status === 404 || /locked/i.test(msg)) {
                core.info('skip-locked: ' + status + ' ' + msg);
                return;
              }
              throw e;
            }

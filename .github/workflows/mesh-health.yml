# Daily cheap health — same probes as desk-tick (ops/config/health-probes.json).
name: mesh-health
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tick:
    uses: ./.github/workflows/desk-tick.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

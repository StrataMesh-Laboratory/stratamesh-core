# Alias of desk-tick. Schedule removed — 09:00 UTC is now on desk-tick cron.
# Keep dispatch so humans can still fire a full probe without waiting.
name: mesh-health
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tick:
    uses: ./.github/workflows/desk-tick.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

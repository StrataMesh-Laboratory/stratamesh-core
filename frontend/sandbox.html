<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox · Calhegas Morais · v0.5.1-lab</title>
  <meta name="description" content="Sandbox StrataMesh — sessão da conta em sandbox.calhegasmorais.pt.">
  <link rel="canonical" href="https://sandbox.calhegasmorais.pt/sandbox">
  <meta name="theme-color" content="#07111c">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root{--bg:#07111c;--fg:#e8e6e3;--muted:#8aa0b3;--line:#1c3348;--acc:#c4a574;--cream:#f3eee4;--ink:#1a1712;--ink2:#5c564c;--still:#8aa0b3;--live:#6b8f71}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
    body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
    header.chrome{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);background:rgba(7,17,28,.94);z-index:3}
    header.chrome h1{font:400 1rem/1.2 Georgia,ui-serif,serif}
    .nav{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
    .nav a,.nav button{color:var(--acc);text-decoration:none;font:600 .65rem/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:transparent;padding:.4rem .65rem;border-radius:2px;cursor:pointer}
    .nav a.here{border-color:var(--acc)}
    #sessionChip{font:500 .68rem/1.3 ui-monospace,Menlo,monospace;color:var(--muted);max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    main.stage{flex:1 1 auto;position:relative;min-height:0}
    #atelierFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07111c}
    .on-stage{display:none!important}
    .object-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
    .on-stage h2{font:500 .92rem/1.2 Georgia,ui-serif,serif}
    .chip{font:600 .58rem/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;border:1px solid #cfc6b6;padding:.22rem .4rem;border-radius:2px;color:var(--ink2)}
    .contains{margin:.15rem 0 .55rem;padding:.4rem .5rem;border:1px dashed #cfc6b6;border-radius:3px}
    .contains h3,.aspect h3{font:600 .58rem/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:.28rem}
    .contains p{font:400 .75rem/1.35 Georgia,ui-serif,serif;color:var(--ink2)}
    .aspect{padding-top:.45rem;border-top:1px solid #d8d0c2}
    .mood{display:flex;align-items:center;gap:.45rem;margin:.2rem 0 .45rem;font:500 .72rem/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
    .lamp{width:.7rem;height:.7rem;border-radius:50%;background:var(--still);box-shadow:0 0 0 3px rgba(138,160,179,.22);flex:0 0 auto}
    .lamp.live{background:var(--live);box-shadow:0 0 0 3px rgba(107,143,113,.28)}
    .lamp.ended{background:#8a6a5a;box-shadow:0 0 0 3px rgba(138,106,90,.28)}
    .tank-label{font:500 .62rem/1.3 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:.28rem}
    .tank{height:.42rem;background:#e4dccf;border:1px solid #cfc6b6;border-radius:2px;overflow:hidden}
    .tank > i{display:block;height:100%;width:0;background:var(--acc)}
    .tank-read{margin-top:.28rem;font:500 .68rem/1.3 ui-monospace,Menlo,monospace;color:var(--ink)}
    .hint{margin:.45rem 0 .5rem;font:400 .78rem/1.4 Georgia,ui-serif,serif;color:var(--ink2)}
    .acts{display:flex;gap:.4rem}
    .acts button{flex:1 1 auto;font:600 .68rem/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid #1a1712;background:#1a1712;color:var(--cream);padding:.48rem .55rem;border-radius:2px;cursor:pointer}
    .acts button.ghost{background:transparent;color:var(--ink)}
    .acts button[disabled]{opacity:.38;cursor:not-allowed}

    @media(max-width:719px){ header.chrome{flex-wrap:wrap} }
  </style>
</head>
<body>
  <header class="chrome">
    <h1>Sandbox</h1>
    <div class="nav">
      <span id="sessionChip" data-acct="conta" data-empty="sem conta · bancada">sem conta · bancada</span>
      <a class="here" href="https://sandbox.calhegasmorais.pt/sandbox">Sandbox</a>
      <a href="https://dashboard.calhegasmorais.pt/dashboard">Bancada</a>
      <a href="https://calhegasmorais.pt/">Lab</a>
      <button type="button" id="btnToken">Tokenização</button>
      <button type="button" id="btnFs">Ecrã inteiro</button>
    </div>
  </header>
  <main class="stage">
    <iframe id="atelierFrame" title="Ateliê GNU" src="about:blank" data-atelier="/gnu-atelier.html?v=20260903e&lang=pt-PT" allow="fullscreen; pointer-lock"></iframe>
    
  </main>
  <script>
    (function () {

      var ORIGIN = location.origin;
      var mood = "still";
      var ended = false;
      var strataUnits = 0;
      var oracleLive = false;
      var contains = [];
      function token() {
        try {
          var m = document.cookie.match(/(?:^|; )sm_token=([^;]*)/);
          var c = m ? decodeURIComponent(m[1]) : "";
          return c || localStorage.getItem("sm_token") || localStorage.getItem("token") || sessionStorage.getItem("sm_token") || "";
        } catch (e) { return ""; }
      }
      function email() {
        try { return localStorage.getItem("sm_email") || ""; }
        catch (e) { return ""; }
      }

      var labels = { still: 'Repouso', live: 'A correr', ended: 'Terminado', containsEmpty: 'Nenhum objecto dentro. Um NFT pode conter outros; a profundidade é regra deste objecto.', sessionEmpty: 'sem conta · bancada' };
      function paintSession() {
        var el = document.getElementById("sessionChip");
        if (!el) return;
        el.innerHTML = '';
        var a = document.createElement('a');
        a.href = 'https://dashboard.calhegasmorais.pt/dashboard';
        a.textContent = labels.sessionEmpty;
        el.appendChild(a);
        var t = token();
        if (!t) return;
        fetch('https://auth.calhegasmorais.pt/api/auth/me', {
          headers: { Authorization: 'Bearer ' + t, Accept: 'application/json' },
          credentials: 'include'
        }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
          var u = (j && (j.user || j)) || {};
          var who = u.email || u.username || '';
          if (!who) return;
          a.textContent = 'sessão · ' + who;
        }).catch(function () {});
      }
      function paintChrome() {
        var lamp = document.getElementById("moodLamp");
        var label = document.getElementById("moodLabel");
        var fill = document.getElementById("tankFill");
        var read = document.getElementById("tankRead");
        var runBtn = document.getElementById("btnRun");
        var restBtn = document.getElementById("btnRest");
        var aspect = document.getElementById("contractAspect");
        var list = document.getElementById("containsList");
        if (!lamp || !label) return;
        lamp.className = "lamp" + (ended ? " ended" : mood === "live" ? " live" : "");
        label.textContent = ended ? labels.ended : (mood === "live" ? labels.live : labels.still);
        fill.style.width = "0";
        read.textContent = strataUnits + " STRATA · " + (oracleLive ? 'vivo' : "lab");
        aspect.setAttribute("data-strata-units", String(strataUnits));
        aspect.setAttribute("data-oracle-live", oracleLive ? "true" : "false");
        aspect.setAttribute("data-mood", ended ? "ended" : mood);
        runBtn.disabled = ended || mood === "live";
        restBtn.disabled = ended || mood === "still";
        list.textContent = contains.length ? contains.map(function (o) { return o.name; }).join(" · ") : labels.containsEmpty;
      }
      function setMood(next) {
        if (ended) return;
        if (next !== "still" && next !== "live") return;
        mood = next;
        paintChrome();
      }
      function pushAtelierSession() { /* no session to pass */ }
      window.pushAtelierSession = pushAtelierSession;
      var tokBtn=document.getElementById("btnToken");
      if(tokBtn) tokBtn.addEventListener("click", function(){
        var u='/tokenize.html';
        try {
          var tt = token();
          var ww = accountWho();
          if (tt && ww) u = u + '#cmn=' + encodeURIComponent(tt) + '&acct=' + encodeURIComponent(ww);
        } catch (e) {}
        var w=window.open(u,'cmn-tokenize','noopener,noreferrer,width=520,height=760');
        if(!w) location.href=u;
      });
      document.getElementById("btnFs").addEventListener("click", function () {
        var f = document.getElementById("atelierFrame");
        if (f && f.requestFullscreen) f.requestFullscreen();
      });

      function takeHandoff() {
        try {
          var h = location.hash || '';
          if (h.indexOf('#cmn=') !== 0) return;
          var rest = h.slice(5);
          var bits = rest.split('&');
          var tok = decodeURIComponent(bits[0] || '');
          var acct = '';
          for (var i = 1; i < bits.length; i++) {
            if (bits[i].indexOf('acct=') === 0) acct = decodeURIComponent(bits[i].slice(5));
          }
          if (tok) { localStorage.setItem('sm_token', tok); localStorage.setItem('token', tok); }
          if (acct) { localStorage.setItem('sm_email', acct); }
          history.replaceState({}, '', location.pathname + location.search);
        } catch (e) {}
      }
      function accountWho() {
        try {
          var e = email();
          if (e) return e;
          var t = token();
          if (!t || t.indexOf('.') < 0) return '';
          var pad = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          while (pad.length % 4) pad += '=';
          var p = JSON.parse(atob(pad));
          return (p && (p.email || p.preferred_username || p.sub)) ? String(p.email || p.preferred_username || p.sub) : '';
        } catch (e) { return ''; }
      }
      function paintAccount(who) {
        var el = document.getElementById('sessionChip');
        if (!el) return;
        el.textContent = who ? ((el.getAttribute('data-acct') || 'conta') + ' · ' + who) : (el.getAttribute('data-empty') || '');
      }
      function requireAccount() {
        takeHandoff();
        var bancada = 'https://dashboard.calhegasmorais.pt/dashboard';
        var t = token();
        var who = accountWho();
        var f = document.getElementById('atelierFrame');
        if (!t || !who) {
          location.replace(bancada + '?next=' + encodeURIComponent(location.origin + location.pathname));
          return;
        }
        paintAccount(who);
        if (f) f.src = f.getAttribute('data-atelier') || '/gnu-atelier.html';
        paintChrome();
        fetch('https://auth.calhegasmorais.pt/api/auth/me', {
          headers: { Authorization: 'Bearer ' + t, Accept: 'application/json' },
          credentials: 'include'
        }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
          var u = (j && (j.user || j)) || {};
          var got = u.email || u.username || '';
          if (got) {
            try { localStorage.setItem('sm_email', got); } catch (e) {}
            paintAccount(got);
          }
        }).catch(function () {});
      }

      paintChrome();
      requireAccount();
    })();
  </script>
</body>
</html>

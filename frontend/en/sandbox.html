<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox · Calhegas Morais · v0.5.1-lab</title>
  <meta name="description" content="StrataMesh sandbox — account session and GNU Atelier renderer.">
  <link rel="canonical" href="https://sandbox.calhegasmorais.pt/en/sandbox">
  <meta name="theme-color" content="#07111c">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root{--bg:#07111c;--fg:#e8e6e3;--muted:#8aa0b3;--line:#1c3348;--acc:#c4a574;--card:#0c1a28}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
    body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
    header.chrome{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);background:rgba(7,17,28,.94)}
    header.chrome h1{font:400 1rem/1.2 Georgia,ui-serif,serif}
    header.chrome h1 span{font:500 .62rem/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:.55rem}
    .nav{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
    .nav a,.nav button{color:var(--acc);text-decoration:none;font:600 .65rem/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:transparent;padding:.4rem .65rem;border-radius:2px;cursor:pointer}
    .nav a.here{border-color:var(--acc)}
    #sessionChip{font:500 .68rem/1.3 ui-monospace,Menlo,monospace;color:var(--muted);max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    main.stage{flex:1 1 auto;position:relative;min-height:0}
    #atelierFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07111c}
  </style>
</head>
<body>
  <header class="chrome">
    <h1>Sandbox <span>not the renderer · contains GNU Atelier</span></h1>
    <div class="nav">
      <span id="sessionChip">session · —</span>
      <a class="here" href="/en/sandbox">Sandbox</a>
      <a href="https://dashboard.calhegasmorais.pt/dashboard">Workbench</a>
      <a href="https://calhegasmorais.pt/en/">Lab</a>
      <button type="button" id="btnFs">Fullscreen</button>
    </div>
  </header>
  <main class="stage">
    <iframe id="atelierFrame" title="GNU Atelier (renderer)" src="https://gnu-atelier.pages.dev/" allow="fullscreen; pointer-lock"></iframe>
  </main>
  <script>
    (function () {
      var ORIGIN = "https://gnu-atelier.pages.dev";
      function token() {
        try { return localStorage.getItem("sm_token") || localStorage.getItem("token") || sessionStorage.getItem("sm_token") || ""; }
        catch (e) { return ""; }
      }
      function email() {
        try { return localStorage.getItem("sm_email") || ""; }
        catch (e) { return ""; }
      }
      function paintSession() {
        var el = document.getElementById("sessionChip");
        if (!el) return;
        var t = token();
        var em = email();
        el.textContent = t ? ("session · " + (em || "account")) : "session · no local token (Atelier will ask to sign in)";
      }
      function pushAtelierSession() {
        try {
          var f = document.getElementById("atelierFrame");
          var tok = token();
          if (!f) return;
          if (tok && f.src.indexOf("#cmn=") < 0) {
            f.src = ORIGIN + "/?space=bancada#cmn=" + encodeURIComponent(tok);
          }
          if (f.contentWindow && tok) {
            f.contentWindow.postMessage({ type: "cmn-session", token: tok, email: email() }, ORIGIN);
          }
        } catch (e) {}
      }
      window.pushAtelierSession = pushAtelierSession;
      window.addEventListener("message", function (e) {
        try {
          if (!e.origin || new URL(e.origin).hostname !== "gnu-atelier.pages.dev") return;
          if (e.data && e.data.type === "cmn-session-ready") pushAtelierSession();
        } catch (err) {}
      });
      document.getElementById("btnFs").addEventListener("click", function () {
        var f = document.getElementById("atelierFrame");
        if (f && f.requestFullscreen) f.requestFullscreen();
      });
      document.getElementById("atelierFrame").addEventListener("load", pushAtelierSession);
      paintSession();
      pushAtelierSession();
    })();
  </script>
</body>
</html>

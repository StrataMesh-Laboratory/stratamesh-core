# Copy to /etc/cloudflared/config.yml after: cloudflared tunnel create stratamesh-fog
# Structural origin is workerd :8788 (fog stays on :8787, not public).
tunnel: REPLACE_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_TUNNEL_ID.json

ingress:
  - hostname: fog.calhegasmorais.pt
    service: http://127.0.0.1:8788
  - service: http_status:404

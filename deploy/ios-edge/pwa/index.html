<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>StrataMesh LAB · Edge</title>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
:root{--bg:#0a0a0b;--fg:#e8e6e3;--muted:#8a8780;--line:#1c1c1f;--acc:#c4a574;--ok:#7aa874;--bad:#c45c54}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:28rem;margin:0 auto;padding:calc(2rem + env(safe-area-inset-top)) 1.25rem 4rem}
h1{font-size:1.15rem;font-weight:600;margin:.2rem 0}
.brand{color:var(--acc);letter-spacing:.08em;font-size:.72rem}
.motto{color:var(--muted);font-size:.8rem}
.card{border:1px solid var(--line);padding:1rem;margin:1rem 0}
label{display:block;color:var(--muted);font-size:.75rem;margin:.6rem 0 .2rem}
input{width:100%;background:#111;border:1px solid var(--line);color:var(--fg);padding:.6rem .7rem;font:inherit}
button{background:transparent;border:1px solid var(--acc);color:var(--acc);padding:.55rem .9rem;margin:.4rem .3rem 0 0;font:inherit}
.gauge{height:8px;background:var(--line);margin:.5rem 0 1rem}
.gauge>i{display:block;height:8px;background:var(--acc);width:0}
.k{color:var(--muted);font-size:.8rem} .v{color:var(--fg)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<p class="brand">STRATAMESH LAB</p>
<h1>Edge Node</h1>
<p class="motto">Intelligentia · Vigilantia · Veritas</p>
<p class="k">C_mesh = f(1−U) · residual only · session expected · not a Fog · not mainnet</p>
<div id="wiz" class="card">
  <p>Registered <b>EDGE</b> node id, then the 6-digit code mailed to the operator.</p>
  <label>Node id</label>
  <input id="nid" placeholder="EDGE-NODE-…" autocomplete="off"/>
  <label>2FA code</label>
  <input id="otp" inputmode="numeric" maxlength="6" placeholder="000000"/>
  <button id="go">Connect</button>
  <p id="werr" class="bad"></p>
</div>
<div id="dash" class="card" hidden>
  <p><span class="k">node</span> <span id="d-id" class="v"></span></p>
  <p><span class="k">C_mesh</span> <span id="d-c" class="v"></span> · <span id="d-why" class="k"></span></p>
  <div class="gauge"><i id="bar"></i></div>
  <p class="k">U <span id="d-u"></span> · battery <span id="d-b"></span> · fg <span id="d-fg"></span></p>
  <p class="k">parent Fog indexed · duty drops in background</p>
  <button id="pulse">Pulse now</button>
  <button id="out">Sign out</button>
  <p id="d-msg" class="k"></p>
</div>
</main>
<script>
const AUTH="https://calhegasmorais.pt/api/auth";
const API="https://api-edge.calhegasmorais.pt";
const W={cpu:0.35,batt:0.25,therm:0.15,net:0.15,fg:0.10};
function clip(x){return Math.max(0,Math.min(1,x))}
function sample(){
  const fg=document.visibilityState==="visible";
  const batt=1, cpu=fg?0.12:0.04, thermal="nominal", net=navigator.onLine?0.08:0.4;
  const battStress=1-batt;
  const U=clip(W.cpu*cpu+W.batt*battStress+W.therm*0+W.net*net+W.fg*(fg?0:1));
  const blocked=batt<0.2||!navigator.onLine;
  const residual=Math.max(0,1-U);
  const duty=fg?1:0.25;
  return {U,cpu,battery:batt,thermal,net,foreground:fg,blocked,C_mesh:blocked?0:residual*duty,why:blocked?"safety_clamp":"residual",duty};
}
async function j(method,url,body,token){
  const r=await fetch(url,{method,headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  const t=await r.text(); let o={}; try{o=JSON.parse(t)}catch(e){o={raw:t.slice(0,200)}}
  o.http=r.status; return o;
}
const st=()=>JSON.parse(localStorage.getItem("sm_edge")||"null");
function save(o){localStorage.setItem("sm_edge",JSON.stringify(o))}
const wiz=document.getElementById("wiz"), dash=document.getElementById("dash");
function show(){
  const s=st();
  wiz.hidden=!!s; dash.hidden=!s;
  if(s){document.getElementById("d-id").textContent=s.node_id; paint(sample());}
}
function paint(x){
  document.getElementById("d-c").textContent=x.C_mesh.toFixed(3);
  document.getElementById("d-why").textContent=x.why;
  document.getElementById("d-u").textContent=x.U.toFixed(3);
  document.getElementById("d-b").textContent=x.battery.toFixed(2);
  document.getElementById("d-fg").textContent=x.foreground?"yes":"no";
  document.getElementById("bar").style.width=(x.C_mesh*100)+"%";
}
document.getElementById("go").onclick=async()=>{
  const node_id=document.getElementById("nid").value.trim().toUpperCase();
  const code=document.getElementById("otp").value.trim();
  const err=document.getElementById("werr"); err.textContent="";
  if(!node_id.startsWith("EDGE")&&!node_id.startsWith("FOG")){err.textContent="Use an EDGE-… id issued by the lab.";return;}
  let ch=JSON.parse(sessionStorage.getItem("sm_ch")||"null");
  if(!ch||ch.node_id!==node_id){
    ch=await j("POST",AUTH+"/fog/bootstrap/challenge",{node_id,lang:"en"});
    if(!ch.success){err.textContent=ch.error||"unknown node";return;}
    sessionStorage.setItem("sm_ch",JSON.stringify(ch));
    err.textContent="Code sent to "+(ch.operator_masked||"operator")+". Enter it.";
    return;
  }
  const vr=await j("POST",AUTH+"/fog/bootstrap/verify",{node_id,challenge:ch.challenge,code,lang:"en"});
  if(!vr.success){err.textContent=vr.error||"bad code";return;}
  save({node_id:vr.node_id,token:vr.bootstrap_token});
  sessionStorage.removeItem("sm_ch"); show(); pulse();
};
document.getElementById("out").onclick=()=>{localStorage.removeItem("sm_edge");show()};
document.getElementById("pulse").onclick=()=>pulse();
async function pulse(){
  const s=st(); if(!s)return;
  const x=sample(); paint(x);
  const r=await j("POST",API+"/v1/edge/heartbeat",{node_id:s.node_id,usage:x,continuity:"session",parent_fog:"FOG-NODE-PT-CM-001",substrate:"ios-pwa"},s.token);
  document.getElementById("d-msg").textContent=r.ok?"heartbeat "+(r.stored||"ok"):(r.error||"offline");
}
document.addEventListener("visibilitychange",()=>{if(st())pulse()});
show();
if(st()){pulse(); setInterval(()=>{if(document.visibilityState==="visible")pulse()},30000)}
</script>
</body>
</html>

# Copy to ~/.hermes/config.yaml (or Hermes default path). No secrets in git.
agent:
  name: hermes-fog
  role: external_agent
  mandate: fog-automation-desk
  not_sca: true
model:
  provider: ollama
  base_url: http://127.0.0.1:11434/v1
  # prefer hermes3:3b; llava is acceptable interim if that is what is pulled
  name: hermes3:3b
channels:
  allow:
    - email   # grok@calhegasmorais.pt only
    - discord # lab only
    - slack   # lab only
  deny_all_others: true
fog:
  health: http://127.0.0.1:8787/health
  academy: https://academy.calhegasmorais.pt
  tui_wizard: ollama_generate

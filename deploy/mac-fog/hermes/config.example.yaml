# Hermes FOG external_agent — copy to ~/.hermes/config.yaml (or Hermes desktop config path)
# NOT an SCA. Desk automation. No secrets in this file.

agent:
  name: hermes-fog
  role: external_agent
  mandate: fog-automation-desk
  not_sca: true
  organizing_principle: specialization

model:
  provider: ollama
  base_url: http://127.0.0.1:11434/v1
  # llava (~32K) FAILS Hermes min 64K — do not use as primary
  # Prefer a ≥64K window model. Override reported window if Ollama under-reports:
  name: qwen2.5:7b-instruct-q4_K_M
  context_length: 65536
  # fallbacks after pull: hermes3:8b, qwen2.5:14b — never llava as sole agent model
  fallbacks:
    - hermes3:8b
    - qwen2.5:7b
    - phi3:medium  # only if context_length override ≥65536 and model truly supports it

# Vision-only / short-context tags (llava) may be used as a *tool* later, not agent init model

fog:
  health: http://127.0.0.1:8787/health
  academy: https://academy.calhegasmorais.pt
  collegium_state: deploy/mac-fog/hermes/desktop/../..  # resolved on Mac after g
  openclaw_ws: ws://127.0.0.1:18789

channels:
  allow:
    - email
    - discord
    - slack
  deny_all_others: true

autonomy:
  bus: propose→constrain→revise→commit|escalate
  specialization: true
  metabol_pace: true
  check_in_before_risky: true

# Shared desk mail (automation.desk@) — PATHS ONLY, no passwords in git.
# BOTH: shared Maildir/SnappyMail/aerc for all agents AND this per-agent mail: pointer.
# See ops/desk-collegium/DESK-MAIL-AUTOMATION.md
mail:
  address: automation.desk@calhegasmorais.pt
  role: external_assistant
  standing: external_assistant_cmn
  shared_client: true
  shared_maildir_box: /home/box/mail/automation.desk
  shared_maildir_mac: ~/mail/automation.desk
  client_snappymail: http://127.0.0.1:8099
  imap_env: ~/.config/stratagrok/automation.desk.imap
  smtp_env: ~/.config/stratagrok/automation.desk.smtp
  sync_token: ~/.config/stratagrok/automation.desk.token
  materialize_env: ~/.config/stratamesh/automation.desk.env
  desk_bearer_token_path: ~/.config/stratagrok/desk-mail.token
  sync: deploy/mac-fog/desk-mail-sync.sh
  notes: |
    Ollama/terminal: configure Messaging Email → automation.desk@
    Load IMAP/SMTP from env files (never paste into yaml).
    Shared client (Maildir+SnappyMail:8099) plus this config — not either/or.
    Bot escalate if vault missing/empty.
  never:
    - workers.dev_as_assistant_fetch
    - secrets_in_git_or_chat
    - eni_geral_mix
    - gmail

shared_desk_machine:
  alias: hermes-desk
  tailscale_host: mbpv
  tailscale_magicdns: mbpv.taild31dc1.ts.net
  tailscale_ipv4: 100.108.35.26  # residual; prefer MagicDNS
  user: andremorais
  workspace: /Users/andremorais/StrataMesh/fog/repo/deploy/mac-fog/hermes/desktop
  fog_src: /Users/andremorais/StrataMesh/fog/repo
  access: tailscale_ssh_or_remote_login
  install: deploy/mac-fog/hermes/desktop/install-desk-ssh.sh
  spec: deploy/mac-fog/hermes/desktop/SSH.md
  never:
    - grok_bot_computers_registration
    - share_stratagrok_bot_desktop
    - secrets_in_git

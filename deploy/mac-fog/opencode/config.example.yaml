# Opencode FOG external_agent — example terminal/Ollama setup
# NOT an SCA. No secrets in this file — vault PATHS only.
# BOTH shared Maildir/SnappyMail AND this per-agent mail: block.

agent:
  name: opencode-fog
  role: external_agent
  specialty: code
  mandate: fog-automation-desk
  not_sca: true

model:
  provider: ollama
  base_url: http://127.0.0.1:11434/v1
  name: qwen2.5:7b-instruct-q4_K_M
  context_length: 65536

fog:
  health: http://127.0.0.1:8787/health
  repo: $FOG_SRC

# Shared desk mail (automation.desk@) — PATHS ONLY, no passwords in git.
# BOTH: shared Maildir/SnappyMail/aerc for all agents AND this per-agent mail: pointer.
# See ops/desk-collegium/DESK-MAIL-AUTOMATION.md
mail:
  address: automation.desk@calhegasmorais.pt
  role: external_assistant
  standing: external_assistant_cmn
  shared_client: true
  shared_maildir_box: /home/box/mail/automation.desk
  shared_maildir_mac: ~/mail/automation.desk
  client_snappymail: http://127.0.0.1:8099
  imap_env: ~/.config/stratagrok/automation.desk.imap
  smtp_env: ~/.config/stratagrok/automation.desk.smtp
  sync_token: ~/.config/stratagrok/automation.desk.token
  materialize_env: ~/.config/stratamesh/automation.desk.env
  desk_bearer_token_path: ~/.config/stratagrok/desk-mail.token
  sync: deploy/mac-fog/desk-mail-sync.sh
  notes: |
    Ollama/terminal: configure Messaging Email → automation.desk@
    Load IMAP/SMTP from env files (never paste into yaml).
    Shared client (Maildir+SnappyMail:8099) plus this config — not either/or.
    Bot escalate if vault missing/empty.
  never:
    - workers.dev_as_assistant_fetch
    - secrets_in_git_or_chat
    - eni_geral_mix
    - gmail

